name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  migrations:
    name: Apply migrations to a fresh database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trustpay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply migrations against fresh Postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trustpay_ci
        run: ./scripts/ci/apply-migrations.sh

      - name: Confirm expected tables exist
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d trustpay_ci -c "\dt" | tee /tmp/tables.txt
          for t in users projects milestones notifications indexer_state auth_nonces; do
            grep -q "$t" /tmp/tables.txt || (echo "Missing table: $t" && exit 1)
          done

  integration:
    name: Integration tests (indexer + RLS)
    runs-on: ubuntu-latest
    needs: [test, migrations]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trustpay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trustpay_ci
        run: ./scripts/ci/apply-migrations.sh

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trustpay_ci
        run: npm run test:integration
